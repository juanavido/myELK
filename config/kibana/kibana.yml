# Kibana configuration with TLS/SSL

server.name: kibana
server.host: "0.0.0.0"
server.port: 5601

# Elasticsearch connection with SSL
elasticsearch.hosts: ["https://elasticsearch:9200"]
elasticsearch.username: "kibana_system"
elasticsearch.password: "${KIBANA_SYSTEM_PASSWORD}"
elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca/ca.crt"]
elasticsearch.ssl.verificationMode: certificate

# Kibana server SSL (optional - for HTTPS access to Kibana)
server.ssl.enabled: true
server.ssl.certificate: /usr/share/kibana/config/certs/kibana/kibana.crt
server.ssl.key: /usr/share/kibana/config/certs/kibana/kibana.key

# Encryption keys
xpack.encryptedSavedObjects.encryptionKey: "${XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY}"
xpack.reporting.encryptionKey: "${XPACK_REPORTING_ENCRYPTIONKEY}"
xpack.security.encryptionKey: "${XPACK_SECURITY_ENCRYPTIONKEY}"

# Default solution
# Nota: Esta opción está disponible en Kibana 9.x.
# En 8.17 no existe la clave `xpack.spaces.defaultSolution`, así que la deshabilitamos.
#xpack.spaces.defaultSolution: es

# Telemetry
telemetry.enabled: false

# =====================================================
# FLEET (preconfiguración)
# =====================================================
xpack.fleet.packages:
  - name: fleet_server
    version: latest
  - name: system
    version: latest
xpack.fleet.agentPolicies:
  - name: Fleet Server Policy
    id: fleet-server-policy
    is_default_fleet_server: true
    has_fleet_server: true
    package_policies:
      - name: fleet_server-1
        package:
          name: fleet_server
  - name: Default Agent Policy
    id: agent-policy-1
    is_default: true
    package_policies:
      - name: system-1
        package:
          name: system
xpack.fleet.fleetServerHosts:
  - id: default-fleet-server
    name: Default Fleet Server
    is_default: true
    host_urls: ["https://fleet-server:8220"]
xpack.fleet.outputs:
  - id: fleet-default-output
    name: default
    type: elasticsearch
    hosts: ["https://elasticsearch:9200"]
    is_default: true
    is_default_monitoring: true
    ca_trusted_fingerprint: "${FLEET_CA_FINGERPRINT}"
